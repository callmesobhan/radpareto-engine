[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "radpareto-engine"
version = "0.2.0"
description = "Closed-loop AAPM TG-233 Task-Based Image Quality x Organ & Peak-Skin-Dose Pareto Protocol Optimization Engine with Frontier Agent Harness and MCP Server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
  { name = "RadPareto Engine Contributors" },
]
keywords = [
  "medical-physics",
  "computed-tomography",
  "fluoroscopy",
  "AAPM-TG-233",
  "SSDE",
  "peak-skin-dose",
  "DICOM-RDSR",
  "pareto-optimization",
  "sobol-sensitivity",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26,<3.0",
  "scipy>=1.13,<2.0",
  "pydantic>=2.7,<3.0",
  "pydicom>=2.4,<4.0",
  "matplotlib>=3.9,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "hypothesis>=6.100",
]

[project.scripts]
radpareto = "radpareto_engine.cli:main"
radpareto-mcp = "radpareto_engine.harness.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radpareto_engine"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-W", "error"]
filterwarnings = [
  "error",
]

[tool.coverage.run]
source = ["src/radpareto_engine"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
precision = 1
fail_under = 75.0

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N802", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
